name: Bootstrap frontend lockfile

on:
  push:
    branches:
      - chore/repository-hardening-v2
    paths:
      - frontend/package.json
      - .github/workflows/frontend-lockfile-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: portfolio-frontend-lockfile-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: chore/repository-hardening-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Validate production build
        working-directory: frontend
        run: npm run build
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- frontend/package-lock.json)" ]]; then
            echo "Frontend lockfile is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): regenerate lockfile after dependency cleanup"
          git push origin HEAD:chore/repository-hardening-v2
